services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elyxstudio-app
    restart: unless-stopped
    ports:
      - "8000:80"
      - "8080:8080"
    environment:
      APP_NAME: ELYX Studio
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      RUN_MIGRATIONS: "true"
    volumes:
      - elyxstudio_storage:/var/www/html/storage
      - elyxstudio_database:/var/www/html/database

volumes:
  elyxstudio_storage:
  elyxstudio_database:

